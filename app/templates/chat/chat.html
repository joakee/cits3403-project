{% extends "base.html" %}
{% block content %}
<div class="container">
    <h3>Chat: {{ conversation.listing.title }}</h3>
    <hr>
    <div id="chat-box"
        style="height: 400px; overflow-y: scroll; border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column-reverse;">
        {% for msg in messages[::-1] %}
        <p><strong>{{ User.query.get(msg.sender_id).username }}:</strong> {{ msg.content }}</p>
        {% endfor %}
    </div>

    <div class="input-group">
        <input type="text" id="message-input" class="form-control" placeholder="Type a message...">
        <button id="send-btn" class="btn btn-primary">Send</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    const socket = io();
    const room = "{{ conversation.id }}";
    socket.emit('join', { room: room });

    document.getElementById('send-btn').onclick = function () {
        const input = document.getElementById('message-input');
        if (input.value) {
            socket.emit('send_message', {
                room: room,
                message: input.value
            });
            input.value = '';
        }
    };

    socket.on('receive_message', function (data) {
        const chatBox = document.getElementById('chat-box');
        const msgElement = document.createElement('p');
        msgElement.innerHTML = `<strong>${data.sender}:</strong> ${data.message}`;
        chatBox.prepend(msgElement);
    });
</script>
{% endblock %}
