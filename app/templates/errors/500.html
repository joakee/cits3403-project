{% extends "base.html" %}
{% block title %}Server Error | UWA Marketplace{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size:5rem; color:var(--navy); opacity:0.15; font-weight:800; line-height:1;">500</div>
    <i class="bi bi-exclamation-triangle" style="font-size:3.5rem; color:var(--navy);"></i>
    <h2 class="fw-bold mt-3" style="color:var(--navy);">Something went wrong</h2>
    <p class="text-muted mt-2 mb-4">An unexpected error occurred. Please try again in a moment.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>Go home
        </a>
        <button onclick="history.back()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Go back
        </button>
    </div>
</div>
{% endblock %}
