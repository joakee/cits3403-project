{% extends "base.html" %}
{% block title %}Page Not Found | UWA Marketplace{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size:5rem; color:var(--navy); opacity:0.15; font-weight:800; line-height:1;">404</div>
    <i class="bi bi-search" style="font-size:3.5rem; color:var(--navy);"></i>
    <h2 class="fw-bold mt-3" style="color:var(--navy);">Page not found</h2>
    <p class="text-muted mt-2 mb-4">The page you're looking for doesn't exist or has been moved.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>Go home
        </a>
        <a href="{{ url_for('listings.index') }}" class="btn btn-outline-secondary">
            <i class="bi bi-grid me-1"></i>Browse listings
        </a>
    </div>
</div>
{% endblock %}
