<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | UWA Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/themeToggle.js') }}"></script>
</head>
<body>
    <button id="theme-toggle" class="btn btn-sm btn-outline-secondary position-fixed"
            style="top: 16px; right: 16px; z-index: 9999;"
            title="Switch to dark mode" aria-label="Toggle dark mode">
        <i class="bi bi-sun-fill"></i>
    </button>
    <div class="page-container">
        <div class="form-card" style="margin-top: 2rem;">
            <h1>Forgot Password</h1>
            <p class="subtitle">Enter your email to reset your password.</p>

            <form class="auth-form" method="POST" action="{{ url_for('auth.forgot_password') }}">
                {{ form.hidden_tag() }}

                <label for="email">Email</label>
                {{ form.email(id="email", placeholder="Enter your email") }}
                {% for error in form.email.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                {% endfor %}

                {{ form.submit(value="Continue") }}
            </form>

            <p class="switch-text">
                <a href="{{ url_for('auth.login') }}">Back to login</a>
            </p>
        </div>
    </div>
</body>
</html>
