{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h3>Verify Your Email</h3>
                    <p class="text-muted">We sent a 6-digit code to {{ current_user.email }}</p>
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <input type="text" name="otp" class="form-control text-center h4" placeholder="000000" maxlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Verify Code</button>
                    </form>

                    <div class="text-center">
                        <p class="small mb-1">Didn't get the code?</p>
                        <a href="{{ url_for('auth.resend_otp') }}" id="resend-link" class="btn btn-link btn-sm text-decoration-none">Resend OTP</a>
                    </div>

                    <script>
                        // Prevent spam clicking the link
                        document.getElementById('resend-link').onclick = function() {
                            this.style.pointerEvents = 'none';
                            this.classList.add('text-muted');
                            this.innerText = 'Sending...';
                        };
                    </script>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
