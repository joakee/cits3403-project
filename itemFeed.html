<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="item.js"></script>
    <script src="filterButton.js"></script>
    <script src="dropdown.js"></script>
  </head>
  <body>
    <div class="">
        <!-- HEADER -->
        <div class="flex items-center justify-between bg-slate-200 py-3 px-6 mb-5 shadow-lg rounded-xl my-3">
            <div class="text-3xl text-slate-800 font-bold">for sale</div>

            <svg class="w-6 h-6 text-slate-800 hover:text-slate-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 17 14">
                <path d="M16 2H1a1 1 0 0 1 0-2h15a1 1 0 1 1 0 2Zm0 6H1a1 1 0 0 1 0-2h15a1 1 0 1 1 0 2Zm0 6H1a1 1 0 0 1 0-2h15a1 1 0 0 1 0 2Z"/>
            </svg>
        </div>

        <!-- SEARCH BAR -->
        <div class="flex gap-4 items-center justify-center">
            <input
                class="bg-slate-200 rounded-xl shadow-inner py-2 px-7 font-bold text-slate-500 focus:text-slate-700 hover:bg-slate-300"
                placeholder="Search"
                id="search"
            >
            <filter-button/>
        </div>
        <!-- ITEMS -->
        <div class="grid xs:grid-cols-2 sm:grid-cols-3 grid-cols-2 justify-center items-center gap-4 p-4">
            <div>
                <sellable-container
                    itemId="1"
                    itemPrice="50"
                    itemName="Calc"
                    itemImageSrc="default.png"
                    sellerName="sellerName"
                />
            </div>
            <div>
                <sellable-container
                    itemId="2"
                    itemPrice="10"
                    itemName="Textbook"
                    itemImageSrc="default.png"
                    sellerName="sellerName"
                />
            </div>
            <div>
                <sellable-container
                    itemId="2"
                    itemPrice="10"
                    itemName="Textbook"
                    itemImageSrc="default.png"
                    sellerName="sellerName"
                />
            </div>
            <div>
                <sellable-container
                    itemId="2"
                    itemPrice="10"
                    itemName="Textbook"
                    itemImageSrc="default.png"
                    sellerName="sellerName"
                />
            </div>
            <div>
                <sellable-container
                    itemId="2"
                    itemPrice="10"
                    itemName="Textbook"
                    itemImageSrc="default.png"
                    sellerName="sellerName"
                />
            </div>
            <div>
                <sellable-container
                    itemId="2"
                    itemPrice="10"
                    itemName="Textbook"
                    itemImageSrc="default.png"
                    sellerName="sellerName"
                />
            </div>
        </div>
        

    </div>
    <script>
        document.getElementById('search').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('sellable-container').forEach(function (el) {
                const name = (el.getAttribute('itemName') || '').toLowerCase();
                el.parentElement.style.display = name.includes(query) ? '' : 'none';
            });
        });
    </script>
  </body>
</html>
